    <text class="detail-heading" x="20" y="20">DETAILS OF PC210*6</text>
    <text class="detail-sub" x="20" y="36">(THICKNESS 6mm) Qty: 24 Nos</text>

    <g id="pc210-drawing" transform="translate(40, 85)">
      <rect id="pc210-rect" class="plate-outline" x="0" y="0" width="104" height="168" rx="2" style="fill:#e0f2fe;" />

      <!-- 4 Purlin Fastener Holes Ø14 -->
      <circle class="bolt-hole" cx="20" cy="28" r="4.5" /><circle class="bolt-hole" cx="84" cy="28" r="4.5" />
      <circle class="bolt-hole" cx="20" cy="92" r="4.5" /><circle class="bolt-hole" cx="84" cy="92" r="4.5" />

      <!-- Fillet Weld Symbol -->
      <g id="pc210-weld" class="weld-symbol">
        <line x1="0" y1="168" x2="104" y2="168" style="stroke-width:2.0;" />
        <path d="M 10 168 L 15 160 M 30 168 L 35 160 M 50 168 L 55 160 M 70 168 L 75 160 M 90 168 L 95 160" />
      </g>

      <!-- Dimensions for PC210 -->
      <line class="dim-line" x1="0" y1="-28" x2="104" y2="-28" />
      <path class="dim-tick" d="M 0 -33 L 0 -23 M 104 -33 L 104 -23" />
      <text class="dim-text" x="52" y="-33" style="font-weight:600;">130</text>

      <line class="dim-line" x1="20" y1="-12" x2="84" y2="-12" />
      <path class="dim-tick" d="M 20 -17 L 20 -7 M 84 -17 L 84 -7" />
      <text class="dim-text" x="52" y="-16">80</text>

      <line class="dim-line" x1="120" y1="0" x2="120" y2="168" />
      <path class="dim-tick" d="M 115 0 L 125 0 M 115 168 L 125 168" />
      <text class="dim-text-vert" x="135" y="88" transform="rotate(90 135 88)">210</text>

      <line class="dim-line" x1="-15" y1="0" x2="-15" y2="28" />
      <line class="dim-line" x1="-15" y1="28" x2="-15" y2="92" />
      <line class="dim-line" x1="-15" y1="92" x2="-15" y2="168" />
      <path class="dim-tick" d="M -20 0 L -10 0 M -20 28 L -10 28 M -20 92 L -10 92 M -20 168 L -10 168" />
      <text class="dim-text-vert" x="-28" y="16">35</text>
      <text class="dim-text-vert" x="-28" y="60">80</text>
      <text class="dim-text-vert" x="-28" y="130">95</text>

      <text class="label-spec" x="20" y="65" style="fill:#dc2626;">4-Ø14 HOLES</text>
    </g>

    <!-- Technical Sheet Ref -->
    <g id="detail-sheet-title" transform="translate(180, 190)">
      <text class="label-spec" x="0" y="0" style="font-size: 11px;">DRAWING: DETAIL OF SC03</text>
      <text class="detail-note" x="0" y="15">DWG NO: ST-10 · REF: BS-26-031 · REV: 00</text>
    </g>
  </g>
</svg>