<svg viewBox="0 -100 1600 1300" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Structural Construction Sequence</title>
  <desc id="desc">Diagram showing the physical logic of construction from foundation up to the roof envelope.</desc>

  <defs>
    <style>
      .primary-line { fill: none; stroke: currentColor; stroke-width: var(--stroke-primary, 1.8px); stroke-linecap: round; stroke-linejoin: round; }
      .secondary-line { fill: none; stroke: currentColor; stroke-width: var(--stroke-secondary, 1.0px); stroke-linecap: round; stroke-linejoin: round; }
      .detail-line { fill: none; stroke: currentColor; stroke-width: var(--stroke-detail, 0.5px); stroke-linecap: round; stroke-linejoin: round; }
      .dashed-line { fill: none; stroke: currentColor; stroke-width: var(--stroke-dashed, 0.8px); stroke-dasharray: 5 5; opacity: 0.7; }
    </style>
  </defs>

  <!-- We use an isometric-like projection for the diagram -->
  <g id="ground" class="detail-line">
    <!-- Perspective grid representing the site -->
    <path id="ground-grid-1" d="M 200,800 L 800,500 L 1400,800 L 800,1100 Z" />
    <path id="ground-grid-2" d="M 400,700 L 1000,1000 M 600,600 L 1200,900" />
    <path id="ground-grid-3" d="M 1200,700 L 600,1000 M 1000,600 L 400,900" />
  </g>

  <g id="foundation" class="primary-line">
    <!-- Concrete raft/foundation outline -->
    <path id="foundation-slab" d="M 300,750 L 800,500 L 1300,750 L 800,1000 Z" />
    <path id="foundation-depth-left" d="M 300,750 L 300,780 L 800,1030 L 800,1000 Z" />
    <path id="foundation-depth-right" d="M 800,1000 L 800,1030 L 1300,780 L 1300,750 Z" />
  </g>

  <g id="columns" class="primary-line">
    <!-- Vertical columns shooting up from foundation -->
    <!-- Column 1 (Left) -->
    <path id="col-1-edge" d="M 350,730 L 350,430" />
    <path id="col-1-side" d="M 370,720 L 370,420" />
    <!-- Column 2 (Top) -->
    <path id="col-2-edge" d="M 750,530 L 750,230" />
    <!-- Column 3 (Right) -->
    <path id="col-3-edge" d="M 1250,730 L 1250,430" />
    <path id="col-3-side" d="M 1230,740 L 1230,440" />
    <!-- Column 4 (Bottom - foreground) -->
    <path id="col-4-edge" d="M 800,950 L 800,650" />
    <path id="col-4-side1" d="M 780,940 L 780,640" />
    <path id="col-4-side2" d="M 820,940 L 820,640" />
  </g>

  <g id="beams" class="secondary-line">
    <!-- Connecting beams at the top of the columns -->
    <path id="beam-left" d="M 350,430 L 750,230" />
    <path id="beam-right" d="M 750,230 L 1250,430" />
    <path id="beam-bottom-right" d="M 1250,430 L 800,650" />
    <path id="beam-bottom-left" d="M 800,650 L 350,430" />
  </g>

  <g id="slabs" class="primary-line">
    <!-- First floor slab, floating slightly above beams -->
    <path id="slab-1" d="M 300,400 L 800,150 L 1300,400 L 800,650 Z" />
    <path id="slab-1-depth-left" d="M 300,400 L 300,430 L 800,680 L 800,650 Z" />
    <path id="slab-1-depth-right" d="M 800,650 L 800,680 L 1300,430 L 1300,400 Z" />
  </g>

  <g id="envelope" class="dashed-line">
    <!-- Wireframe bounding box showing the final massing volume -->
    <path id="mass-left" d="M 300,400 L 300,200 L 800,-50 L 800,150" />
    <path id="mass-right" d="M 800,-50 L 1300,200 L 1300,400" />
    <path id="mass-front-left" d="M 300,200 L 800,450 L 800,650" />
    <path id="mass-front-right" d="M 800,450 L 1300,200" />
  </g>
</svg>
